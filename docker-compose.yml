services:
  mongodb:
    image: mongo:7-jammy
    container_name: xgrowth-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: xgrowth
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-runner
    container_name: xgrowth-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/xgrowth
      BUFFER_API_KEY: ${BUFFER_API_KEY:-mock-buffer-api-key}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-mock-gemini-api-key}
      GLOBAL_PAUSE: ${GLOBAL_PAUSE:-true}
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  mongo_data:
    driver: local
